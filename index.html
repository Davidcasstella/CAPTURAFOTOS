<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura Automática de Fotos y Video</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Cargar TensorFlow.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <!-- Cargar COCO-SSD (para detección de personas) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <!-- Cargar el archivo JavaScript que manejará la lógica -->
  <script defer src="js/capture.js"></script>
  <style>
    /* Establecemos un Grid para la disposición */
    .container {
      display: grid;
      grid-template-columns: 1fr 2fr;  /* 2 columnas: la izquierda más pequeña (1fr), la derecha más grande (2fr) */
      gap: 20px;
      margin-top: 20px;
    }

    /* Contenedor de los errores a la izquierda */
    #debug-logs {
      background-color: #eee;
      padding: 10px;
      overflow-y: auto;
      height: 400px;
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column-reverse; /* Muestra los logs más recientes arriba */
    }

    /* Contenedor para las fotos a la derecha, llena todo el espacio disponible */
    #photos {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid #ddd;
      padding: 10px;
      height: 100%; /* Llena toda el área disponible */
      overflow-y: auto;
      flex-direction: column-reverse; /* Muestra las fotos más recientes arriba */
      margin-top: 20px;
    }

    /* Contenedor para la cámara y botones */
    #camera-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: flex-start;
    }

    /* Estilos de los botones */
    button {
      margin: 10px 0;
      width: 100%;
    }

    /* Estilo para el estado de detección de movimiento */
    #movement-status {
      font-size: 18px;
      font-weight: bold;
    }

    /* Ajustes de video en vivo */
    #video {
      width: 100%;
      height: 240px;
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Captura Automática de Fotos y Video</h1>

  <div class="container">
    <!-- Área de Errores (izquierda) -->
    <div id="debug-logs">
      <h3>Errores actualizados</h3>
      <pre id="debug-console">Aquí aparecerán los errores</pre>
    </div>

    <!-- Área de Cámara y Fotos (derecha) -->
    <div id="camera-container">
      <!-- Controles para iniciar la cámara -->
      <button onclick="startVideo()">Iniciar Cámara</button>
      <button onclick="stopRecording()">Detener Grabación</button>

      <!-- Video en vivo -->
      <video id="video" autoplay muted playsinline></video>

      <!-- Botón para captura manual -->
      <button onclick="capturePhoto()">Capturar Foto Manual</button>
      <!-- Botón para detener todos los procesos -->
      <button onclick="stopAllProcesses()">Detener todos los procesos</button>

      <!-- Estado de detección de movimiento -->
      <div id="movement-status">Esperando movimiento...</div>

      <!-- Contenedor para las fotos capturadas (zona marcada en negro) -->
      <div id="photos">
        <p>Fotos actualizadas aquí</p>
      </div>
    </div>
  </div>

  <!-- Configuración para la cantidad de fotos -->
  <div>
    <label for="photo-count">Cantidad de Fotos:</label>
    <input type="range" id="photo-count" min="1" max="20" value="1" />
    <span id="photo-count-value">1</span> <!-- Este valor se actualizará con el slider -->
  </div>

  <script>
    // Actualiza el valor del slider en tiempo real
    const photoCountSlider = document.getElementById('photo-count');
    const photoCountValue = document.getElementById('photo-count-value');

    // Event listener para el slider de cantidad de fotos
    photoCountSlider.addEventListener('input', () => {
      photoCountValue.textContent = photoCountSlider.value;  // Actualiza el valor en tiempo real
    });

    // Asegúrate de que el valor inicial también esté mostrado
    photoCountValue.textContent = photoCountSlider.value;
  </script>
</body>
</html>
